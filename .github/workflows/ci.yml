name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Lint, Test, and Build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: "6.2"

      - name: Install Tuist
        run: |
          version="4.191.5"
          install_dir="$HOME/.tuist/Versions/$version"
          mkdir -p "$install_dir"
          curl -fsSLo tuist.zip "https://github.com/tuist/tuist/releases/download/$version/tuist.zip"
          printf '%s  %s\n' '40ed31fa657c30d1aff6b4cebf0cd9fb0aaa613b23aa29f589ec1790b7baf0f4' 'tuist.zip' | shasum -a 256 -c -
          unzip -q tuist.zip -d "$install_dir"
          chmod +x "$install_dir/tuist"

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Lint Swift formatting
        run: swift format lint --recursive Sources Tests Apps scripts Project.swift Tuist.swift

      - name: Run Swift tests
        run: swift test --parallel

      - name: Build CLI release binary
        run: swift build -c release

      - name: Smoke test CLI
        run: swift run apple-template --version

      - name: Install Tuist dependencies
        run: ./scripts/tuist.sh install

      - name: Generate Xcode workspace
        run: ./scripts/tuist.sh generate --no-open

      - name: Build iOS app
        run: xcodebuild -workspace AppleTemplate.xcworkspace -scheme AppleTemplateiOS -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

      - name: Build macOS app
        run: xcodebuild -workspace AppleTemplate.xcworkspace -scheme AppleTemplateMac build CODE_SIGNING_ALLOWED=NO
