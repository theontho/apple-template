# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: |
  Be concise and direct. Focus on correctness, security, and maintainability.
  Skip nits about style/formatting (handled by swift-format).

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/.build/**"
    - "!**/DerivedData/**"
    - "!**/Derived/**"
    - "!**/*.xcodeproj/**"
    - "!**/*.xcworkspace/**"
    - "!Package.resolved"
    - "!out/**"
    - "!tmp/**"
    - "!scratch/**"
    - "!**/*.lock"
  path_instructions:
    - path: "Sources/**/*.swift"
      instructions: |
        Reusable business logic in *Core targets; CLI parsing/output in *CLI targets.
        Prefer explicit error handling over force unwraps/tries. Use Codable value types for config/data.
        Greenfield project — do not suggest backward-compatibility shims.
    - path: "Apps/**/*.swift"
      instructions: |
        SwiftUI app code. Watch for Swift 6.2 type-checker timeouts when chaining multiple
        sorted-dictionary .map{...}.joined() calls inline — pre-bind to typed [String].
    - path: "Tests/**/*.swift"
      instructions: |
        XCTest. Verify both success and failure paths.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
